<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快樂！給最特別的你</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff85a2;
            --secondary-gold: #f6d365;
            --text-color: #4a4a4a;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-color);
            overflow: hidden;
            background-color: #fff5f7;
        }

        .cursive {
            font-family: 'Dancing Script', cursive;
        }

        #effect-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        #firework-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
        }

        .text-gradient {
            background: linear-gradient(120deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .flash-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .flash-item.active {
            opacity: 1;
        }

        .view-section {
            display: none;
            width: 100%;
            height: 100vh;
        }

        .view-section.active {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <canvas id="effect-canvas"></canvas>

    <div class="fixed top-6 right-6 z-50">
        <button id="music-btn" class="p-3 glass rounded-full shadow-lg hover:scale-110 transition-transform">
            <span id="music-icon">🎵</span>
        </button>
        <audio id="bg-music" loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <main class="relative z-10 w-full h-screen">
        
        <section id="home-view" class="view-section active justify-center items-center px-6 text-center">
            <div class="animate-float mb-8">
                <div class="w-40 h-40 md:w-56 md:h-56 rounded-full border-8 border-white shadow-2xl overflow-hidden mx-auto">
                    <img src="images/avatar.jpg" alt="壽星" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400?text=Please+Upload+Photo'">
                </div>
            </div>

            <h1 class="text-4xl md:text-6xl font-bold mb-4 text-gradient">祝你生日快樂!</h1>
            <p class="text-xl md:text-2xl mb-8 cursive text-pink-500">To: 親愛的 [壽星名字]</p>

            <div class="glass p-6 md:p-8 max-w-xl w-full grid grid-cols-4 gap-4 shadow-xl">
                <div><span id="days" class="block text-3xl font-bold text-pink-600">00</span><span class="text-sm">天</span></div>
                <div><span id="hours" class="block text-3xl font-bold text-pink-600">00</span><span class="text-sm">時</span></div>
                <div><span id="minutes" class="block text-3xl font-bold text-pink-600">00</span><span class="text-sm">分</span></div>
                <div><span id="seconds" class="block text-3xl font-bold text-pink-600">00</span><span class="text-sm">秒</span></div>
            </div>

            <div class="mt-12">
                <button onclick="startFlashShow()" class="bg-pink-500 text-white px-8 py-3 rounded-full shadow-lg hover:bg-pink-600 transition-colors">
                    開啟時光機
                </button>
            </div>
        </section>

        <section id="flash-view" class="view-section relative bg-black overflow-hidden">
            <div id="flash-container" class="w-full h-full">
            </div>
            <div id="flash-finish-btn" class="absolute bottom-20 left-1/2 -translate-x-1/2 z-20 hidden">
                <button onclick="showFinalPage()" class="bg-white text-pink-600 px-10 py-4 rounded-full font-bold shadow-2xl hover:scale-105 transition-transform">
                    查看最終驚喜 ➔
                </button>
            </div>
        </section>

        <section id="final-view" class="view-section relative justify-center items-center bg-gray-900 text-center px-6 overflow-hidden">
            <canvas id="firework-canvas"></canvas>

            <div class="max-w-2xl relative z-10">
                <h2 class="text-6xl md:text-8xl font-bold text-gradient mb-8 drop-shadow-lg">HAPPY BIRTHDAY!</h2>
                <div class="text-4xl md:text-6xl mb-12 animate-pulse">🎂✨🎁</div>
                <p class="text-xl md:text-2xl text-white leading-relaxed mb-10 opacity-90">
                    在這個特別的日子裡，願你每一天都充滿陽光，每一刻都帶著微笑。<br>
                    未來的日子裡，我們繼續創造更多美好的回憶。
                </p>
                <div class="cursive text-4xl text-pink-400 drop-shadow-md">Love You Forever ❤️</div>
                <button onclick="location.reload()" class="mt-16 text-gray-400 hover:text-pink-300 text-sm transition-colors">
                    重新播放時光機
                </button>
            </div>
        </section>

    </main>

    <script>
        const BIRTHDAY_DATE = new Date(2025, 4, 20, 0, 0, 0); 
        
        const flashImages = [
            { src: 'images/photo1.jpg', date: '2023.05.12', text: '我們的初見' },
            { src: 'images/photo2.jpg', date: '2023.08.20', text: '夏日的旅行' },
            { src: 'images/photo3.jpg', date: '2023.12.24', text: '冬日的暖陽' },
            { src: 'images/avatar.jpg', date: '今天', text: '最好的你' }
        ];

        function updateCountdown() {
            const now = new Date();
            let diff = BIRTHDAY_DATE - now;
            if (diff < 0) {
                BIRTHDAY_DATE.setFullYear(now.getFullYear() + (now.getMonth() > BIRTHDAY_DATE.getMonth() ? 1 : 0));
                diff = BIRTHDAY_DATE - now;
            }
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById('hours').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
            document.getElementById('minutes').innerText = Math.floor((diff / (1000 * 60)) % 60).toString().padStart(2, '0');
            document.getElementById('seconds').innerText = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function startFlashShow() {
            switchView('flash-view');
            const container = document.getElementById('flash-container');
            container.innerHTML = ''; 

            flashImages.forEach((imgObj, index) => {
                const div = document.createElement('div');
                div.className = 'flash-item';
                div.innerHTML = `
                    <img src="${imgObj.src}" class="max-w-[85%] max-h-[70vh] object-contain shadow-2xl border-4 border-white mb-6">
                    <div class="text-white text-center">
                        <p class="text-pink-400 font-bold text-2xl mb-2">${imgObj.date}</p>
                        <p class="text-xl opacity-80">${imgObj.text}</p>
                    </div>
                `;
                container.appendChild(div);
            });

            let currentIndex = 0;
            const items = document.querySelectorAll('.flash-item');

            function showNext() {
                if (currentIndex > 0) items[currentIndex - 1].classList.remove('active');
                if (currentIndex < items.length) {
                    items[currentIndex].classList.add('active');
                    currentIndex++;
                    setTimeout(showNext, 3000); 
                } else {
                    document.getElementById('flash-finish-btn').classList.remove('hidden');
                }
            }
            setTimeout(showNext, 500); 
        }

        function showFinalPage() {
            switchView('final-view');
            initFireworks();
        }

        const musicBtn = document.getElementById('music-btn');
        const audio = document.getElementById('bg-music');
        let isPlaying = false;
        musicBtn.addEventListener('click', () => {
            if (isPlaying) { audio.pause(); document.getElementById('music-icon').innerText = '🔇'; }
            else { audio.play(); document.getElementById('music-icon').innerText = '🎵'; }
            isPlaying = !isPlaying;
        });

        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let trailParticles = [];
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.3) {
                trailParticles.push(new TrailHeart(e.clientX, e.clientY));
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0 && Math.random() > 0.3) {
                trailParticles.push(new TrailHeart(e.touches[0].clientX, e.touches[0].clientY));
            }
        });

        class Heart {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 10 + 5;
                this.speed = Math.random() * 2 + 1;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.swing = Math.random() * 2;
                this.swingStep = 0;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ff85a2';
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size/2, -this.size/2, -this.size, this.size/3, 0, this.size);
                ctx.bezierCurveTo(this.size, this.size/3, this.size/2, -this.size/2, 0, 0);
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.y += this.speed;
                this.swingStep += 0.02;
                this.x += Math.sin(this.swingStep) * this.swing;
                if (this.y > canvas.height) this.reset();
            }
        }

        class TrailHeart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * -2 - 1;
                this.opacity = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= 0.03;
                this.size -= 0.1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = '#ff85a2';
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size/2, -this.size/2, -this.size, this.size/3, 0, this.size);
                ctx.bezierCurveTo(this.size, this.size/3, this.size/2, -this.size/2, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 30; i++) particles.push(new Heart());
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            
            for (let i = trailParticles.length - 1; i >= 0; i--) {
                const p = trailParticles[i];
                p.update();
                p.draw();
                if (p.opacity <= 0 || p.size <= 0) {
                    trailParticles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        const fwCanvas = document.getElementById('firework-canvas');
        const fwCtx = fwCanvas.getContext('2d');
        let fireworks = [];
        let fireworkParticles = [];

        function initFireworks() {
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
            animateFireworks();
            setInterval(() => {
                if (document.getElementById('final-view').classList.contains('active')) {
                    createFirework();
                }
            }, 1000);
        }

        function createFirework() {
            const x = Math.random() * fwCanvas.width;
            const y = fwCanvas.height;
            const targetY = Math.random() * (fwCanvas.height / 2);
            const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            fireworks.push({ x, y, targetY, color, speed: 5 });
        }

        function explode(x, y, color) {
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                fireworkParticles.push({
                    x, y, color,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    decay: Math.random() * 0.015 + 0.01
                });
            }
        }

        function animateFireworks() {
            if (!document.getElementById('final-view').classList.contains('active')) return;
            
            fwCtx.fillStyle = 'rgba(17, 24, 39, 0.2)';
            fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);

            fireworks.forEach((fw, index) => {
                fw.y -= fw.speed;
                fwCtx.beginPath();
                fwCtx.arc(fw.x, fw.y, 2, 0, Math.PI * 2);
                fwCtx.fillStyle = fw.color;
                fwCtx.fill();

                if (fw.y <= fw.targetY) {
                    explode(fw.x, fw.y, fw.color);
                    fireworks.splice(index, 1);
                }
            });

            fireworkParticles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.alpha -= p.decay;

                fwCtx.save();
                fwCtx.globalAlpha = p.alpha;
                fwCtx.beginPath();
                fwCtx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                fwCtx.fillStyle = p.color;
                fwCtx.fill();
                fwCtx.restore();

                if (p.alpha <= 0) {
                    fireworkParticles.splice(index, 1);
                }
            });

            requestAnimationFrame(animateFireworks);
        }
    </script>
</body>
</html>
