<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快樂！給最特別的你</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-pink: #ff85a2; --secondary-gold: #f6d365; --text-color: #4a4a4a; }
        body { font-family: 'Noto Sans SC', sans-serif; color: var(--text-color); overflow: hidden; background-color: #fff5f7; }
        .cursive { font-family: 'Dancing Script', cursive; }
        #effect-canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }
        #lock-screen { position: fixed; inset: 0; z-index: 9999; background: linear-gradient(135deg,#fff0f5,#ffe4f0); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        #lock-screen h2 { font-size: 2rem; font-weight: 700; background: linear-gradient(120deg,#f093fb,#f5576c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #lock-screen p { color: #aaa; font-size: 0.82rem; }
        #pwd-input { width: 320px; padding: 14px 18px; border: 2px solid #ffb3cc; border-radius: 999px; font-size: 1rem; text-align: center; outline: none; letter-spacing: 2px; background: rgba(255,255,255,0.8); transition: border-color .3s; }
        #pwd-input:focus { border-color: #ff85a2; }
        #unlock-btn { padding: 12px 40px; background: #ff85a2; color: #fff; border: none; border-radius: 999px; font-size: 1rem; cursor: pointer; transition: background .2s, transform .1s; }
        #unlock-btn:hover { background: #f5576c; transform: scale(1.05); }
        #lock-error { color: #f5576c; font-size: 0.85rem; min-height: 1.2em; }
        #firework-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; }
        .text-gradient { background: linear-gradient(120deg, #f093fb 0%, #f5576c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .flash-item { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; display: flex; justify-content: center; align-items: center; background: #000; }
        .flash-item.active { opacity: 1; }
        .view-section { display: none; width: 100%; height: 100vh; }
        .view-section.active { display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div id="lock-screen">
        <div style="font-size:3rem">🔐</div>
        <h2>輸入密碼以繼續</h2>
        <p>需要 28 位密碼（含大小寫英文、數字、特殊符號）</p>
        <input id="pwd-input" type="password" maxlength="28" placeholder="••••••••••••••••••••••••••••" autocomplete="off">
        <button id="unlock-btn" onclick="checkPassword()">解鎖 ❤️</button>
        <div id="lock-error"></div>
    </div>
    
    <div id="app-root"></div>

    <script>
        const _PWD_HASH = '1a753a99d885a22fa56a0ed936f068e74301f09a4e93bc2118a4e128a72ee8e2';
        let attempts = 0;
        
        async function checkPassword() {
            const val = document.getElementById('pwd-input').value;
            const err = document.getElementById('lock-error');
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
            const h = Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
            
            if (h === _PWD_HASH) {
                document.getElementById('lock-screen').style.display = 'none';
                buildApp();
            } else {
                attempts++;
                document.getElementById('pwd-input').value = '';
                err.innerText = attempts >= 3 ? `密碼錯誤（已嘗試 ${attempts} 次），請確認後再試` : '密碼錯誤，請再試一次';
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pwd-input').addEventListener('keydown', e => {
                if (e.key === 'Enter') checkPassword();
            });
        });

        function buildApp() {
            const root = document.getElementById('app-root');
            
            const t1 = ['祝','你','生','日','快','樂','!'].join('');
            const t2 = ['T','o',':',' ','親','愛','的','M','O','N','I','C','A','！','！','！'].join('');
            const t3 = ['天'].join('');
            const t4 = ['時'].join('');
            const t5 = ['分'].join('');
            const t6 = ['秒'].join('');
            const t7 = ['開','啟','時','光','機'].join('');
            const t8 = ['點','！',' ','➔'].join('');
            const t9 = ['H','A','P','P','Y',' ','B','I','R','T','H','D','A','Y','!'].join('');
            const t10 = ['在','這','個','特','別','的','日','子','裡','，','願','你','每','一','天','都','充','滿','陽','光','，','每','一','刻','都','帶','著','微','笑','。'].join('');
            const t11 = ['未','來','的','日','子','裡','，','我','們','繼','續','創','造','更','多','美','好','的','回','憶','。'].join('');
            const t12 = ['L','o','v','e',' ','Y','o','u',' ','F','o','r','e','v','e','r',' ','❤','️'].join('');
            const t13 = ['重','新','播','放','時','光','機'].join('');

            root.innerHTML = `
                <canvas id="effect-canvas"></canvas>
                <div class="fixed top-6 right-6 z-50">
                    <button id="music-btn" class="p-3 glass rounded-full shadow-lg hover:scale-110 transition-transform">
                        <span id="music-icon">🎵</span>
                    </button>
                    <audio id="bg-music" loop>
                        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                    </audio>
                </div>
                <main class="relative z-10 w-full h-screen">
                    <section id="home-view" class="view-section active justify-center items-center px-6 text-center">
                        <div class="animate-float mb-8">
                            <div class="w-40 h-40 md:w-56 md:h-56 rounded-full border-8 border-white shadow-2xl overflow-hidden mx-auto">
                                <img id="avatar-img" alt="❤️" class="w-full h-full object-cover">
                            </div>
                        </div>
                        <h1 class="text-4xl md:text-6xl font-bold mb-4 text-gradient">${t1}</h1>
                        <p class="text-xl md:text-2xl mb-8 cursive text-pink-500">${t2}</p>
                        <div class="glass p-6 md:p-8 max-w-xl w-full grid grid-cols-4 gap-4 shadow-xl mx-auto">
                            <div><span id="days" class="block text-3xl font-bold text-pink-600">00</span><span class="text-sm">${t3}</span></div>
                            <div><span id="hours" class="block text-3xl font-bold text-pink-600">00</span><span class="text-sm">${t4}</span></div>
                            <div><span id="minutes" class="block text-3xl font-bold text-pink-600">00</span><span class="text-sm">${t5}</span></div>
                            <div><span id="seconds" class="block text-3xl font-bold text-pink-600">00</span><span class="text-sm">${t6}</span></div>
                        </div>
                        <div class="mt-12">
                            <button onclick="startFlashShow()" class="bg-pink-500 text-white px-8 py-3 rounded-full shadow-lg hover:bg-pink-600 transition-colors">${t7}</button>
                        </div>
                    </section>
                    <section id="flash-view" class="view-section relative bg-black overflow-hidden">
                        <div id="flash-container" class="w-full h-full"></div>
                        <div id="flash-finish-btn" class="absolute bottom-20 left-1/2 -translate-x-1/2 z-20 hidden">
                            <button onclick="showFinalPage()" class="bg-white text-pink-600 px-10 py-4 rounded-full font-bold shadow-2xl hover:scale-105 transition-transform">${t8}</button>
                        </div>
                    </section>
                    <section id="final-view" class="view-section relative justify-center items-center bg-gray-900 text-center px-6 overflow-hidden">
                        <canvas id="firework-canvas"></canvas>
                        <div class="max-w-2xl relative z-10">
                            <h2 class="text-6xl md:text-8xl font-bold text-gradient mb-8 drop-shadow-lg">${t9}</h2>
                            <div class="text-4xl md:text-6xl mb-12 animate-pulse">🎂</div>
                            <p class="text-xl md:text-2xl text-white leading-relaxed mb-10 opacity-90">${t10}<br>${t11}</p>
                            <div class="cursive text-4xl text-pink-400 drop-shadow-md">${t12}</div>
                            <button onclick="location.reload()" class="mt-16 text-gray-400 hover:text-pink-300 text-sm transition-colors">${t13}</button>
                        </div>
                    </section>
                </main>
            `;
            initAppLogic();
        }

        function initAppLogic() {
            const R2 = [atob('aHR0cHM6Ly8='),atob('YmlydGhkYXktcHJveHku'),atob('bGlta2FpbGluZzc3Mw=='),atob('LndvcmtlcnMuZGV2'),atob('L2ltYWdlcw==')].join('');
            document.getElementById('avatar-img').src = `${R2}/IMG_2421.JPG`;
            
            const flashImages = [
                `${R2}/IDG_20251220_214506_562.JPG`, `${R2}/IDG_20260110_164620_835.JPG`,
                `${R2}/IDG_20260227_101519_019.JPG`, `${R2}/IDG_20260227_153707_409.JPG`,
                `${R2}/IMG_2421.JPG`,  `${R2}/IMG_2490.JPG`, `${R2}/IMG_2550.JPG`,  `${R2}/IMG_2723.JPG`,
                `${R2}/IMG_2825.JPG`,  `${R2}/IMG_2998.JPG`, `${R2}/IMG_3014.JPG`,  `${R2}/IMG_3081.JPG`,
                `${R2}/IMG_4691.JPG`,  `${R2}/IMG_4763.jpg`, `${R2}/IMG_5090.JPG`,  `${R2}/IMG_5185.JPG`,
                `${R2}/IMG_5256.JPG`,  `${R2}/IMG_5287.JPG`, `${R2}/IMG_5330.JPG`,  `${R2}/IMG_5409.JPG`,
                `${R2}/IMG_5421.JPG`,  `${R2}/IMG_5481.JPG`, `${R2}/IMG_5495.JPG`,  `${R2}/IMG_5593.JPG`,
                `${R2}/IMG_5599.JPG`,  `${R2}/IMG_5614.JPG`, `${R2}/IMG_5637.JPG`,  `${R2}/IMG_5704.JPG`,
                `${R2}/IMG_6185.JPG`,  `${R2}/IMG_6225.JPG`, `${R2}/IMG_6913.JPG`,  `${R2}/IMG_6946.JPG`,
                `${R2}/IMG_7034.JPG`,  `${R2}/IMG_7098.JPG`, `${R2}/IMG_7189.JPG`,  `${R2}/IMG_7306.JPG`,
                `${R2}/IMG_7364.JPG`,  `${R2}/IMG_7974.JPG`, `${R2}/IMG_7903.JPG`,  `${R2}/IMG_7666.JPG`
            ];

            const BIRTHDAY_DATE = new Date(2025, 2, 23, 0, 0, 0);
            function updateCountdown() {
                const now = new Date();
                let diff = BIRTHDAY_DATE - now;
                if (diff < 0) {
                    BIRTHDAY_DATE.setFullYear(now.getFullYear() + (now.getMonth() > BIRTHDAY_DATE.getMonth() ? 1 : 0));
                    diff = BIRTHDAY_DATE - now;
                }
                document.getElementById('days').innerText    = Math.floor(diff / 86400000).toString().padStart(2,'0');
                document.getElementById('hours').innerText   = Math.floor(diff / 3600000 % 24).toString().padStart(2,'0');
                document.getElementById('minutes').innerText = Math.floor(diff / 60000 % 60).toString().padStart(2,'0');
                document.getElementById('seconds').innerText = Math.floor(diff / 1000 % 60).toString().padStart(2,'0');
            }
            setInterval(updateCountdown, 1000); updateCountdown();

            window.switchView = function(id) {
                document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            }

            window.startFlashShow = function() {
                window.switchView('flash-view');
                const container = document.getElementById('flash-container');
                container.innerHTML = '';
                flashImages.forEach(src => {
                    const div = document.createElement('div');
                    div.className = 'flash-item';
                    div.innerHTML = `<img src="${src}" class="max-w-[90%] max-h-[90vh] object-contain shadow-2xl border-2 border-white">`;
                    container.appendChild(div);
                });
                let idx = 0;
                const items = document.querySelectorAll('.flash-item');
                function showNext() {
                    if (idx > 0) items[idx-1].classList.remove('active');
                    if (idx < items.length) { items[idx].classList.add('active'); idx++; setTimeout(showNext, 2000); }
                    else { document.getElementById('flash-finish-btn').classList.remove('hidden'); }
                }
                setTimeout(showNext, 500);
            }

            window.showFinalPage = function() { window.switchView('final-view'); initFireworks(); }

            const musicBtn = document.getElementById('music-btn');
            const audio = document.getElementById('bg-music');
            let isPlaying = false;
            musicBtn.addEventListener('click', () => {
                isPlaying ? audio.pause() : audio.play();
                isPlaying = !isPlaying;
                document.getElementById('music-icon').innerText = isPlaying ? '🎵' : '🔇';
            });

            const canvas = document.getElementById('effect-canvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            
            function drawHeart(c, s) {
                c.beginPath();
                c.moveTo(0, 0);
                c.bezierCurveTo(-s/2, -s/2, -s, s/3, 0, s);
                c.bezierCurveTo(s, s/3, s/2, -s/2, 0, 0);
            }
            
            class FallHeart {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width; this.y = -20;
                    this.size = Math.random() * 10 + 5; this.speed = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.5 + 0.3;
                    this.swing = Math.random() * 2; this.swingStep = 0;
                }
                update() {
                    this.y += this.speed; this.swingStep += 0.02;
                    this.x += Math.sin(this.swingStep) * this.swing;
                    if (this.y > canvas.height) this.reset();
                }
                draw() {
                    ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = '#ff85a2';
                    ctx.translate(this.x, this.y); drawHeart(ctx, this.size); ctx.fill(); ctx.restore();
                }
            }
            
            class TrailHeart {
                constructor(x, y) {
                    this.x = x; this.y = y;
                    this.size = Math.random() * 12 + 6;
                    this.opacity = 1;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = Math.random() * -2 - 1;
                    this.color = `hsl(${Math.random() * 40 + 330}, 100%, 65%)`;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.vy += 0.05; this.size -= 0.15; this.opacity -= 0.025;
                }
                draw() {
                    if (this.opacity <= 0 || this.size <= 0) return;
                    ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color;
                    ctx.translate(this.x, this.y); drawHeart(ctx, this.size); ctx.fill(); ctx.restore();
                }
                get dead() { return this.opacity <= 0 || this.size <= 0; }
            }
            
            const fallHearts = Array.from({ length: 30 }, () => new FallHeart());
            let trailHearts = [];
            let lastTrail = 0;
            
            function spawnTrail(x, y) {
                const now = Date.now();
                if (now - lastTrail < 30) return;
                lastTrail = now;
                for (let i = 0; i < 3; i++) trailHearts.push(new TrailHeart(x, y));
            }
            
            window.addEventListener('mousemove', e => spawnTrail(e.clientX, e.clientY));
            window.addEventListener('touchmove', e => {
                e.preventDefault();
                Array.from(e.touches).forEach(t => spawnTrail(t.clientX, t.clientY));
            }, { passive: false });
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                fallHearts.forEach(h => { h.update(); h.draw(); });
                trailHearts = trailHearts.filter(h => { h.update(); h.draw(); return !h.dead; });
                requestAnimationFrame(animate);
            }
            animate();
            
            const fwCanvas = document.getElementById('firework-canvas');
            const fwCtx = fwCanvas.getContext('2d');
            let fireworks = [], fwParticles = [];
            
            function initFireworks() {
                fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight;
                animateFireworks();
                setInterval(() => {
                    if (document.getElementById('final-view').classList.contains('active')) createFirework();
                }, 1000);
            }
            
            function createFirework() {
                fireworks.push({
                    x: Math.random() * fwCanvas.width, y: fwCanvas.height,
                    targetY: Math.random() * fwCanvas.height / 2,
                    color: `hsl(${Math.random()*360},100%,50%)`, speed: 5
                });
            }
            
            function explode(x, y, color) {
                for (let i = 0; i < 50; i++) {
                    const a = Math.random() * Math.PI * 2, s = Math.random() * 4 + 2;
                    fwParticles.push({ x, y, color, vx: Math.cos(a)*s, vy: Math.sin(a)*s, alpha: 1, decay: Math.random()*0.015+0.01 });
                }
            }
            
            function animateFireworks() {
                if (!document.getElementById('final-view').classList.contains('active')) return;
                fwCtx.fillStyle = 'rgba(17,24,39,0.2)'; fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
                fireworks.forEach((fw, i) => {
                    fw.y -= fw.speed;
                    fwCtx.beginPath(); fwCtx.arc(fw.x, fw.y, 2, 0, Math.PI*2);
                    fwCtx.fillStyle = fw.color; fwCtx.fill();
                    if (fw.y <= fw.targetY) { explode(fw.x, fw.y, fw.color); fireworks.splice(i, 1); }
                });
                fwParticles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.alpha -= p.decay;
                    fwCtx.save(); fwCtx.globalAlpha = p.alpha;
                    fwCtx.beginPath(); fwCtx.arc(p.x, p.y, 1.5, 0, Math.PI*2);
                    fwCtx.fillStyle = p.color; fwCtx.fill(); fwCtx.restore();
                    if (p.alpha <= 0) fwParticles.splice(i, 1);
                });
                requestAnimationFrame(animateFireworks);
            }
        }
    </script>
</body>
</html>
